<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060c"/><stop offset=".5" stop-color="#0c1226"/><stop offset="1" stop-color="#05060c"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa4b8"/></linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6366f1" stop-opacity=".38"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="r"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle r="260" fill="url(#g1)"><animateMotion dur="12s" repeatCount="indefinite" path="M150,80 C400,260 600,0 850,200 C600,60 400,280 150,80"/></circle>
    <circle r="240" fill="url(#g2)"><animateMotion dur="14s" repeatCount="indefinite" path="M850,220 C600,20 400,280 150,160 C400,260 600,40 850,220"/></circle>
    <g stroke="#ffffff" stroke-opacity=".05">
      <path d="M0 60H1000M0 120H1000M0 180H1000M0 240H1000"/>
      <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300"/>
    </g>
    <g fill="#fff">
      <circle cx="70" cy="55" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="240" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="2.6s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="35" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="255" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="50" r="2.4"><animate attributeName="opacity" values=".1;1;.1" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="210" r="1.6"><animate attributeName="opacity" values=".1;1;.1" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
    </g>
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="900" font-size="112" letter-spacing="10" fill="url(#txt)" opacity=".35" filter="url(#blur)">OğuzZ</text>
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="900" font-size="112" letter-spacing="10" fill="url(#txt)">OğuzZ
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
    <rect x="380" y="190" width="240" height="2" rx="1" fill="#ffffff" fill-opacity=".85">
      <animate attributeName="width" values="0;240" dur="1.4s" begin=".4s" fill="freeze"/>
      <animate attributeName="x" values="500;380" dur="1.4s" begin=".4s" fill="freeze"/></rect>
    <text x="500" y="240" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" letter-spacing="7" fill="#94a3b8">WEB  ·  MOBİL  ·  FİKİRDEN YAYINA</text>
  </g>
</svg>
